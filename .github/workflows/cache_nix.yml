name: Build Nix Binaries

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - state/version.txt
      - go.mod
      - go.sum
      - gomod2nix.toml
      - flake.nix
      - flake.lock
      - nix/pkgs/*.nix
  workflow_dispatch:

jobs:
  x86_64-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14

      - name: Build x86_64-linux binary
        run: |
          nix build --accept-flake-config -L .#packages.x86_64-linux.watgbridge
          mkdir -p dist
          cp -L ./result/bin/watgbridge dist/watgbridge-linux-x86_64
          chmod +x dist/watgbridge-linux-x86_64

      - name: Upload x86_64-linux binary
        uses: actions/upload-artifact@v4
        with:
          name: watgbridge-linux-x86_64
          path: dist/watgbridge-linux-x86_64
          if-no-files-found: error

  aarch64-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14

      - name: Build aarch64-linux binary
        run: |
          nix build --accept-flake-config -L .#packages.aarch64-linux.watgbridge
          mkdir -p dist
          cp -L ./result/bin/watgbridge dist/watgbridge-linux-aarch64
          chmod +x dist/watgbridge-linux-aarch64

      - name: Upload aarch64-linux binary
        uses: actions/upload-artifact@v4
        with:
          name: watgbridge-linux-aarch64
          path: dist/watgbridge-linux-aarch64
          if-no-files-found: error
